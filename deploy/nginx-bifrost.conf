# Host-level nginx reverse proxy for the Bifrost backend, with TLS.
#
# This is NOT managed by docker-compose or the CI deploy — it lives on the
# droplet host at /etc/nginx/sites-available/bifrost.sslip.io. Kept here for
# reproducibility. To recreate on a fresh host:
#
#   1. Copy this file to /etc/nginx/sites-available/bifrost.sslip.io and symlink
#      it into /etc/nginx/sites-enabled/.
#   2. nginx -t && systemctl reload nginx
#   3. certbot --nginx -d <IP>.sslip.io --agree-tos -m you@example.com --redirect
#      (certbot rewrites this file in place to add the :443 server block and the
#      HTTP->HTTPS redirect; HTTP-01 challenge needs port 80 reachable.)
#
# The hostname uses sslip.io: <dotted-ip>.sslip.io resolves to that IP, so
# Let's Encrypt can issue a real, browser-trusted cert without owning a domain.
# Replace 206.189.100.31 with the host's public IP.

server {
    listen 80;
    listen [::]:80;
    server_name 206.189.100.31.sslip.io;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep upstream keep-alive and allow Server-Sent Events / streaming.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
